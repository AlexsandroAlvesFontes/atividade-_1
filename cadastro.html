<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Cyber Café</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <!-- CABEÇALHO -->
    <header>

        <div class="logo">
            ☕ Cyber Café
        </div>

        <p>Café, tecnologia e diversão</p>

    </header>


    <!-- MENU -->
    <nav>

        <a href="index.html">Início</a>
        <a href="cadastro.html">Cadastro</a>
        <a href="contato.html">Contato</a>
        <a href="sobre.html">Sobre</a>

    </nav>


    <!-- CONTEÚDO -->
    <main>

        <section class="pagina-cadastro">

            <div class="titulo-pagina">

                <span>👤</span>

                <h1>Cadastro</h1>

                <p>
                    Cadastre-se para aproveitar melhor
                    sua experiência no Cyber Café.
                </p>

            </div>


            <!-- FORMULÁRIO -->
            <form>

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                        >

                    </div>


                    <div class="campo">

                        <label for="nascimento">
                            Data de nascimento
                        </label>

                        <input
                            type="date"
                            id="nascimento"
                            name="nascimento"
                        >

                    </div>

                </div>


                <div class="campo">

                    <label for="usuario">
                        Nome de usuário
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Escolha um nome de usuário"
                        required
                    >

                </div>


                <div class="linha">

                    <div class="campo">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required
                        >

                    </div>


                    <div class="campo">

                        <label for="confirmar">
                            Confirmar senha
                        </label>

                        <input
                            type="password"
                            id="confirmar"
                            name="confirmar"
                            placeholder="Confirme sua senha"
                            required
                        >

                    </div>

                </div>


                <!-- TERMOS -->
                <div class="termos">

                    <input
                        type="checkbox"
                        id="termos"
                        required
                    >

                    <label for="termos">
                        Concordo com os termos de uso.
                    </label>

                </div>


                <!-- BOTÕES -->
                <div class="botoes-formulario">

                    <button
                        type="submit"
                        class="botao"
                    >
                        Criar cadastro
                    </button>

                    <button
                        type="reset"
                        class="botao cancelar"
                    >
                        Limpar
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- RODAPÉ -->
    <footer>

        <div class="footer-logo">
            ☕ Cyber Café
        </div>

        <p>
            Café, tecnologia e diversão.
        </p>

        <p class="copyright">
            © 2026 Cyber Café - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
